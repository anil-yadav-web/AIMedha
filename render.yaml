services:
  - type: web
    name: find-that-notice
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.lock && cd frontend && npx --yes npm@11.6.2 ci && npm run build && cd .. && python -m scripts.prepare
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 22.16.0
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: SIMILARITY_THRESHOLD
        value: "0.63"
      - key: ADMIN_TOKEN
        generateValue: true
